<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="icon-pulse mb-3 mx-auto">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Titulo</h3>
            <p class="text-muted small">Ingresa tus credenciales de administrador</p>
          </div>

          <form id="formLogin">
            <div class="form-floating mb-3">
              <input type="email" class="form-control input-modern" id="emailAdmin" placeholder="admin@ues.edu.sv" required autocomplete="off">
              <label for="emailAdmin" class="text-muted"><i class="bi bi-envelope me-2"></i>Correo electrónico</label>
            </div>

            <div class="form-floating mb-4">
              <input type="password" class="form-control input-modern" id="passwordAdmin" placeholder="Contraseña" required>
              <label for="passwordAdmin" class="text-muted"><i class="bi bi-key me-2"></i>Contraseña</label>
            </div>

            <button type="submit" class="btn custom-btn w-100" id="btnLogin">
              <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </button>
          </form>

          <div id="errorLogin" class="alert alert-danger mt-3 d-none text-center small rounded-3" role="alert">
            Credenciales incorrectas. Intenta de nuevo.
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
