<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="../css/admin-global.css">
  <link rel="stylesheet" href="../css/graficos.css">
  <link rel="icon" type="image/x-icon" href="../img/G.ico">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container-fluid h-100 p-0">
    <div class="row g-0 h-100">

      <!-- Sidebar -->
      <aside class="col-md-3 col-lg-2 sidebar-custom d-flex flex-column p-3 text-white">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 mt-2 text-white text-decoration-none">
          <i class="bi bi-layers-half fs-3 me-2 text-primary-light"></i>
          <span class="fs-5 fw-bold">SURVEY</span>
        </a>
        <hr class="border-secondary mt-0">
        
        <ul class="nav nav-pills flex-column mb-auto mt-2">
          <li class="nav-item mb-2">
            <a href="dashboard.html" class="nav-link text-white">
              <i class="bi bi-speedometer2 me-2"></i> Inicio
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="crear-pregunta.html" class="nav-link text-white">
              <i class="bi bi-ui-checks-grid me-2"></i> Crear Pregunta
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="graficas.html" class="nav-link active">
              <i class="bi bi-pie-chart-fill me-2"></i> Ver Gráficas
            </a>
          </li>
          <li class="nav-item mt-3">
            <a href="../index.html" class="nav-link text-white border border-secondary rounded" target="_blank">
              <i class="bi bi-box-arrow-up-right me-2"></i> Ver Encuesta
            </a>
          </li>
        </ul>
        <hr class="border-secondary">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <small class="fw-bold">ADMIN</small>
          </div>
          <button id="btnLogout" class="btn btn-sm btn-outline-danger border-0" title="Cerrar Sesión">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>
      </aside>

      <!-- Contenido Principal -->
      <main class="col-md-9 col-lg-10 main-content p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h2 class="fw-bold text-dark mb-0">
            <i class="bi bi-pie-chart-fill me-2 text-primary"></i>Análisis Estadístico
          </h2>
          
       <div class="d-flex align-items-center gap-2">
          <span class="badge bg-primary px-3 py-2 rounded-pill" id="totalRespuestasBadge">
            Cargando respuestas...
          </span>
          <button id="btnExportarPDF" class="btn btn-outline-primary btn-sm rounded-pill ms-2">
            <i class="bi bi-file-earmark-pdf-fill me-1"></i> Generar Reporte PDF
          </button>
          <button id="btnVaciarRespuestas" class="btn btn-outline-danger btn-sm rounded-pill">
            <i class="bi bi-trash3-fill me-1"></i> Vaciar Respuestas
          </button>
        </div>
        
        <!-- Contenedor dinámico de gráficas -->
        <div class="row g-4" id="contenedorGraficas">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Procesando métricas...</span>
            </div>
            <p class="text-muted mt-2 small">Cargando datos en tiempo real...</p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script type="module" src="../js/admin-global.js"></script>
  <script type="module" src="../js/graficas.js"></script>
</body>
</html>
