<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/admin-global.css">
  <link rel="stylesheet" href="../css/dashboard.css">

  <link rel="icon" type="image/x-icon" href="../img/D.ico">
</head>
<body>

  <div class="container-fluid h-100 p-0">
    <div class="row g-0 h-100">
      
      <!-- Sidebar / Menú Lateral -->
      <aside class="col-md-3 col-lg-2 sidebar-custom d-flex flex-column p-3 text-white">
        <a href="dashboard.html" class="d-flex align-items-center mb-4 mt-2 text-white text-decoration-none">
          <i class="bi bi-layers-half fs-3 me-2 text-primary-light"></i>
          <span class="fs-5 fw-bold">SURVEY</span>
        </a>
        <hr class="border-secondary mt-0">
        
        <ul class="nav nav-pills flex-column mb-auto mt-2">
          <li class="nav-item mb-2">
            <a href="dashboard.html" class="nav-link active">
              <i class="bi bi-speedometer2 me-2"></i> Inicio
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="crear-pregunta.html" class="nav-link text-white">
              <i class="bi bi-ui-checks-grid me-2"></i> Crear Pregunta
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="graficas.html" class="nav-link text-white">
              <i class="bi bi-pie-chart-fill me-2"></i> Ver Gráficas
            </a>
          </li>
          <li class="nav-item mt-3">
            <a href="../index.html" class="nav-link text-white border border-secondary rounded" target="_blank">
              <i class="bi bi-box-arrow-up-right me-2"></i> Ver Encuesta
            </a>
          </li>
        </ul>
        <hr class="border-secondary">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <small class="fw-bold">ADMIN</small>
          </div>
          <button id="btnLogout" class="btn btn-sm btn-outline-danger border-0" title="Cerrar Sesión">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>
      </aside>

      <!-- Contenido Principal -->
      <main class="col-md-9 col-lg-10 main-content p-4 p-md-5">
        <h2 class="fw-bold mb-4 text-dark"><i class="bi bi-speedometer2 me-2 text-primary"></i>Panel de Control</h2>
        
        <div class="row g-4 mb-5">
          <div class="col-md-6 col-lg-4">
            <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="icon-pulse mb-3"><i class="bi bi-plus-circle fs-2"></i></div>
                <h4 class="fw-bold text-dark">Gestión de Preguntas</h4>
                <p class="text-muted small">Añade nuevas preguntas de opción múltiple.</p>
              </div>
              <a href="crear-pregunta.html" class="btn custom-btn w-100 text-decoration-none text-center mt-3">Ir a Configurar</a>
            </div>
          </div>

          <div class="col-md-6 col-lg-4">
            <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="icon-pulse mb-3"><i class="bi bi-bar-chart-line fs-2"></i></div>
                <h4 class="fw-bold text-dark">Reportes y Métricas</h4>
                <p class="text-muted small">Visualiza las respuestas en gráficos dinámicos en tiempo real.</p>
              </div>
              <a href="graficas.html" class="btn custom-btn w-100 text-decoration-none text-center mt-3">Ver Analíticas</a>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script type="module" src="../js/admin-global.js"></script>
</body>
</html>
