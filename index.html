<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/estudiante.css">
</head>
<body>

  <div class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
      <div class="col-md-10 col-lg-8">
        
        <div class="glass-card p-4 p-md-5">
          
          <!-- Encabezado con Icono Restaurado -->
          <div class="text-center mb-4">
            <div class="icon-pulse mb-3 mx-auto">
              <i class="bi bi-file-earmark-text-fill fs-2"></i>
            </div>

            <h3 class="fw-bold text-primary text-uppercase mb-3" id="dispTitulo">
              Cargando Encuesta...
            </h3>
            
            <div class="text-start bg-light p-3 rounded-3 border mb-3" id="boxObjetivo">
              <p class="mb-0 small text-dark" id="dispObjetivo">
                <strong>Objetivo:</strong> Cargando objetivo...
              </p>
            </div>
          </div>

          <form id="formEncuesta" novalidate>
            <!-- Correo -->
            <div class="form-floating mb-4">
              <input type="email" class="form-control input-modern" id="correoEstudiante" placeholder="usuario@ues.edu.sv" required autocomplete="off">
              <label for="correoEstudiante"><i class="bi bi-envelope-at me-2"></i>Correo universitario / personal</label>
              <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
            </div>

            <hr class="my-4 border-secondary opacity-25">

            <!-- Contenedor dinámico de preguntas -->
            <div id="contenedorPreguntas">
              <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Cargando formulario...</span>
                </div>
                <p class="text-muted small mt-2">Cargando preguntas dinámicas...</p>
              </div>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="btn custom-btn w-100 mt-4" id="btnEnviarRespuestas" disabled>
              <i class="bi bi-send-fill me-2"></i> Enviar Encuesta
            </button>
          </form>

          <!-- Alerta de Confirmación (Éxito) -->
          <div id="alertaExito" class="alert alert-success mt-4 d-none d-flex align-items-center rounded-3" role="alert">
            <div class="alert-icon-wrap me-3">
              <i class="bi bi-check2-circle fs-4"></i>
            </div>
            <div>
              <h6 class="mb-0 fw-bold">¡Muchas gracias!</h6>
              <small class="opacity-75">Tus respuestas han sido registradas exitosamente.</small>
            </div>
          </div>

          <!-- Alerta de Error / Advertencia -->
          <div id="alertaError" class="alert alert-danger mt-4 d-none d-flex align-items-center rounded-3" role="alert">
            <div class="alert-icon-wrap me-3">
              <i class="bi bi-exclamation-triangle-fill fs-4"></i>
            </div>
            <div>
              <h6 class="mb-0 fw-bold" id="alertaErrorTitulo">Atención</h6>
              <small id="alertaErrorTexto" class="opacity-75">Por favor, completa los campos requeridos.</small>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script type="module" src="./js/estudiante.js"></script>
</body>
</html>
